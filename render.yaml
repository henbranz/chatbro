services:
  - type: web
    name: chat-bro-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/messages.db
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
    disk:
      name: chat-bro-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: chat-bro-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: CHAT_BRO_API_BASE_URL
        value: https://chat-bro-api.onrender.com
